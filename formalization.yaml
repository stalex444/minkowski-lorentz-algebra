version: "v0.4"

project:
  name: "Invariant bilinear forms on the Lorentz Lie algebra so(3,1): the two-parameter family a tr(XY) + b tr(H(X)Y), with sl(2,C), the exponential criterion and the complexification"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of nine statements about
    the Lie algebra L of the linear endomorphisms of four-dimensional
    Minkowski space that are skew-adjoint for the Minkowski form.
    Main theorem, (6): a real
    bilinear form B on L satisfies B([Z,X],Y) + B(X,[Z,Y]) = 0 for all
    X, Y, Z if and only if B(X,Y) = a tr(XY) + b tr(H(X)Y) for exactly
    one pair of real numbers (a,b); every such form is symmetric. Here
    tr(XY) is the trace form of L acting on Minkowski space and H is the
    operator of (4). For a real simple Lie algebra whose complexification
    is simple the invariant symmetric bilinear forms are the multiples of
    the Killing form; for a complex simple Lie algebra regarded as a real
    one they form a plane (Francis-Staite and Leistner, Proposition 4.1).
    L is of the second kind: it is sl(2,C) regarded as a real Lie algebra
    ((1), (2)), H is multiplication by -i under that isomorphism ((4)),
    and tr(H(X)Y) is a second invariant form, not a multiple of the
    Killing form (Olafsson and Quiroga-Barranco, Remark A.10, where it is,
    up to a nonzero factor, K(X, J Y)). Read with X as a field strength,
    tr(XX) and tr(H(X)X) are, up to normalisation, the Maxwell term and
    the theta term (Tong's names); that reading is not formalized.
    Statements (1)-(5): sl(2,C), the exponential criterion, the operator
    H and the complexification; (2) and (4) are the structure behind the
    second term of (6).
    (1) On Mathlib's own objects, with nothing carried: Mathlib's
    so' (Fin 1) (Fin 3) R is isomorphic, as a real Lie algebra, to
    sl(2,C) (Mathlib's sl (Fin 2) C with scalars restricted to R), by the
    explicit map X -> -(1/2) sum_k (beta_k + i theta_k) sigma_k, where
    beta_k and theta_k are the boost and rotation entries of X and
    sigma_k are the Pauli matrices. (2) On the carried copy of Minkowski
    space: L has dimension 6; the same map is an isomorphism of real Lie
    algebras from L onto sl(2,C); the three boost generators and the
    three rotation generators are in L, the boost along the axis k goes
    to -(1/2) sigma_k and the rotation in the plane of the two other axes
    goes to -(i/2) sigma_k. (3) The exponential criterion: a continuous
    linear endomorphism A is in L if and only if exp(tA) is in the
    carried type ProperLorentz for every real t; the statement also
    records that the Minkowski form used for L has the carried
    minkowskiSquare as its quadratic form. (4) The explicit operator H
    (the boost along the axis k goes to minus the rotation in the plane
    of the two other axes, and that rotation goes to the boost) maps L
    into L, is real-linear there, satisfies H[X,Y] = [X,HY] and
    H(HX) = -X, and the isomorphism of (2) carries it to multiplication
    by -i on sl(2,C). (5) The complexification C (x)_R L is isomorphic,
    as a complex Lie algebra, to sl(2,C) x sl(2,C), and the two maps
    (1/2)(1 + iH) and (1/2)(1 - iH) are the projections onto the two
    factors, H being the operator of (4) extended C-linearly.
    Controls: (7) for the definite diagonal form diag(1,1,1,1) the Lie
    algebra of skew matrices is isomorphic to so(3) x so(3), for the
    split form diag(1,1,-1,-1) it is isomorphic to sl(2,R) x sl(2,R), and
    neither of the two is isomorphic to sl(2,C) as a real Lie algebra;
    (8) there is a bilinear form on L that is not
    a tr(XY) + b tr(H(X)Y) for any real a, b; (9) there is a continuous
    linear endomorphism A with exp(A) in ProperLorentz and A not in L.
    Numbering as in comparator.json.
    Statement (1) and part (b) of statement (2) are one isomorphism on
    two presentations; they are not two results. The Challenge imports
    Mathlib only. The definitions of Minkowski space and of the Lorentz
    transformations (Spacetime, minkowskiSquare, ProperLorentz and eight
    more) are copies carried textually from the public statement of the
    Yang-Mills release, repository
    github.com/yang-mills-group/OpenAI-YM-20261028, commit
    3456e5e75cf8d4cd558955a5c7638fba2d68f464, file PublicTheory.lean,
    under the Apache License, Version 2.0; the source file is not
    imported. Statement (6) is proved from the classification of the
    linear maps R of L with R[X,Y] = [X,RY], which is the subject of a
    separate entry in preparation and is not compared here.
    Audience. Formal developments that use the Lorentz Lie algebra as an
    object. physlib's lorentzAlgebra is Mathlib's so' (Fin 1) (Fin 3) R,
    the object of (1); physlib also proves that the complex coefficient
    tensors with four vector indices invariant under SL(2,C) acting
    through the Lorentz group are combinations of the three pairings of
    the metric and the alternating symbol (independence is not proved
    there). The Yang-Mills release works with the Lorentz Lie algebra of
    this entry as the predicate tangent (X^T = -theta X theta) on its own
    4 x 4 matrix type, splits it into rotations and boosts
    (tangent_parts), and proves, under its hypothesis Spin.Port, that its
    Wick-rotated map into operators on field labels respects brackets
    whenever the first argument is a boost (rank_bracket), in
    YM/Next/BOUNDARY/Derived.lean; it does not state or use any of the
    nine statements here, and its matrix type is not the carried
    Spacetime. The monograph project hairer/humanise-yang-mills proves
    that invariant bilinear forms on the compact colour algebra are
    scalar multiples using a positive invariant inner product
    (manuscript/existence/trace-free-rank.tex, lines 34-51, commit
    0f00ae72); (6) shows that on so(3,1), which is simple but has no such
    inner product, the invariant forms are a two-parameter family. No one
    at these projects was contacted, and none of them has asked for or
    endorsed this entry.
    Literature. This entry formalizes known mathematics; the clauses not found printed are listed below.
    (1) and (2) are the Lie-algebra form of Spin(3,1) = SL(2,C) (Woit,
    Quantum Theory, Groups and Representations, sections 40.2 and 40.4; the formula is printed on generators in section 41.2; Olafsson and Quiroga-Barranco, Lemma A.1, state so(3,1) = sl(2,C)_R);
    (3) is the description of the Lie algebra of a matrix group by its
    one-parameter subgroups (Hall, arXiv:math-ph/0005032, Definition 3.13;
    proved there for O(n;k), which includes O(3;1), Chapter 3, section 5.6), stated here for the
    proper orthochronous subgroup, and (9) is an exercise
    of that chapter; (4) is the Hodge operator on so(3,1) (Wise, Class.
    Quantum Grav. 27 (2010) 155010, Appendix); (5) is the splitting of
    the complexified Lorentz algebra (Woit, section 40.2; Sahlmann and
    Seeger, Class. Quantum Grav. 41 (2024) 075010, section 2.2.1); (6) is
    the description of the invariant bilinear forms of a complex simple
    Lie algebra regarded as a real one (Olafsson and Quiroga-Barranco,
    Transform. Groups 17 (2012), Remark A.10; Francis-Staite and
    Leistner, Transform. Groups 26 (2021), Proposition 4.1); parts (a)
    and (b) of (7) are the companion isomorphisms in the two other
    signatures (Woit, section 21.2; Olafsson and Quiroga-Barranco, Remark
    A.2); (8) holds by a count of dimensions (the bilinear forms on L have
    dimension 36 and the forms of statement 6 are a plane). Not found
    printed in the sources read: the clause of (4) on multiplication by
    -i, and parts (c) and (d) of (7); README.md says how each follows from
    what is printed.
    Prior formalization, recorded under related_formalizations (search of
    2026-11-13): no formalization of a compared statement was found. The
    counterparts for groups of (1), (2), (5), (7a) and (7b) are in
    TauCeti, and the homomorphism from SL(2,C) onto the restricted
    Lorentz group is in physlib; every ingredient of (1) and (2) is in
    TauCeti and was not found combined there. The equivalence of (3) is
    proved in TauCeti as a general theorem for the unitary group of a
    complete normed real algebra with a continuous involution (the
    form-preservation part of (3) is a case of it, by a reading that was
    not compiled), for the
    matrix groups O(n), SO(n), SL(n), SU(n) and the symplectic group, and
    for the Spin groups; its direction from the algebra to the group is
    proved for Lorentz matrices in physlib and in OSreconstruction; it
    was not found with both directions for the Lorentz group or another
    indefinite orthogonal group of linear maps. For (6), TauCeti has the
    uniqueness of invariant forms over an algebraically closed field and
    physlib the invariant coefficient tensors with four vector indices.
    For (5), TauCeti has extension of scalars for the skew-adjoint
    matrices of a Gram matrix and the complexifications of so(n) and
    su(n); the splitting into sl(2,C) x sl(2,C) was not found.
    The Hodge operator of Euclidean four-space on matrices is in
    github.com/openai/math.
    Not formalized: no covering map from SL(2,C) to ProperLorentz, no Lie
    group structure, no connectedness statement, no statement that every
    element of ProperLorentz is an exponential; other dimensions and
    signatures beyond (7); the identification of L with two-forms; the
    Killing form; the invariant forms of the complexification.
    Also proved in the library, not compared: Minkowski space from a number
    field. For a number
    field K with exactly two real places and exactly one complex place
    there is a real-linear equivalence e from Mathlib's mixedSpace K onto
    Spacetime with minkowskiSquare(e x) = -Tr_{K/Q}(x^2) for every x in
    K, and conjugation by e is an isomorphism of real Lie algebras onto L
    from the Lie algebra of the endomorphisms of mixedSpace K that are
    skew-adjoint for the form that restricts to Tr_{K/Q}(x^2) on K. This
    is proved in the library of this entry and is not compared.
  authors:
    - "Stephanie Alexander"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # Each code is in the registry's taxonomy snapshot. math.RT / 17B20 (simple, semisimple, reductive Lie
  # algebras), 22E43 (structure and representation of the Lorentz group),
  # 17B05 (structure theory of Lie algebras), 15A63 (quadratic and
  # bilinear forms): the nine statements. math-ph, gr-qc, hep-th / 17B81
  # (applications of Lie algebras to physics), 83A05 (special relativity):
  # the subject and the cited application. No compared statement is a
  # physical claim.
  arxiv: ["math.RT", "math-ph", "gr-qc", "hep-th"]
  msc2020: ["17B20", "22E43", "17B05", "15A63", "17B81", "83A05"]

sources:
  - title: "Quantum Theory, Groups and Representations: An Introduction"
    authors:
      - "P. Woit"
    id: "Author's revised and expanded draft of 20 October 2025 (580 pp.); first edition Springer, Cham, 2017, DOI 10.1007/978-3-319-64612-1, not opened"
    # Bibliographic record Crossref-verified 2026-11-13: DOI
    # 10.1007/978-3-319-64612-1. READ 2026-11-13 in the author's revised
    # and expanded draft, title page dated 20 October 2025 (580 pp.),
    # math.columbia.edu/~woit/QM/qmbook.pdf. Section and page numbers are
    # those of that draft. The Springer printing was not opened.
    type: "book"
    location: "https://www.math.columbia.edu/~woit/QM/qmbook.pdf"
    relationship: "formalizes"
    note: >-
      Scoped to statements 1, 2, 5 and 7(a). Section 40.2 (pp. 429-430 of
      the draft): the Lorentz group has dimension six; generators l_j, k_j
      with the brackets (40.1), (40.2); the complex combinations
      A_j = (1/2)(l_j + i k_j), B_j = (1/2)(l_j - i k_j) give
      so(3,1) (x) C = sl(2,C) + sl(2,C). Section 40.4 (pp. 431-434):
      Spin(3,1) is identified with SL(2,C), which is said to have the same
      Lie algebra as SO(3,1); the action (40.4) of SL(2,C) on Hermitian
      matrices; Spin(4) = SU(2) x SU(2) and Spin(2,2) = SL(2,R) x SL(2,R)
      for the groups. Section 21.2 (p. 241): so(4) = su(2) x su(2) =
      so(3) x so(3). Problem 2 of section B.18 (p. 553) poses
      so(4,C) = sl(2,C) + sl(2,C) and its real subalgebras as a problem.
      Section 41.2 (p. 441) prints the representation pi' of so(3,1): the
      upper block of pi'(k_j) is -(1/2) sigma_j and that of pi'(l_j) is
      -(i/2) sigma_j, which is the explicit formula of statements 1 and 2
      on generators (Woit's l_j, k_j are this entry's rotations and boosts
      with the time index moved from the beginning to the end); the upper
      blocks of pi'(A_j), pi'(B_j) are -(i/2) sigma_j and 0. The formula
      is also the derivative of (40.4) with the opposite sign for the
      boosts (differentiating (40.4) sends a boost to +(1/2) sigma and a
      rotation to -(i/2) sigma; a computation made for this entry).
      Statement 7(b) is in this source for the groups only. The proofs
      here were not written from this text; see fidelity. The Springer
      printing was not opened; section and page numbers are those of the
      draft.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "An Elementary Introduction to Groups and Representations"
    authors:
      - "B. C. Hall"
    id: "arXiv:math-ph/0005032v1"
    # READ 2026-11-13 in the arXiv PDF (128 pp.); page numbers are those
    # printed in it. The arXiv record's journal-reference field names an
    # expanded version published as Graduate Texts in Mathematics 222
    # (Springer, 2003); that book was not opened.
    type: "paper"
    location: "https://arxiv.org/abs/math-ph/0005032"
    relationship: "formalizes"
    note: >-
      Scoped to statements 3 and 9. Definition 3.13 (p. 36): the Lie
      algebra of a matrix Lie group G is the set of matrices X with
      e^{tX} in G for all real t; the text after it (p. 37) says that
      e^X in G alone is not enough. Chapter 3, section 5.6 (p. 38): for
      the generalized orthogonal group O(n;k) with its diagonal matrix g,
      e^{tX} is in O(n;k) for all real t exactly when g X^tr g = -X; the
      Lie algebra so(n;k) of O(n;k) is that of SO(n;k), and the source
      says, without proof in the passage, that the identity component has
      the same Lie algebra. Statement 3 is this for O(3;1) and the
      carried type ProperLorentz (determinant 1, the forward cone
      preserved); connectedness is not formalized here. Chapter 3,
      Exercise 5 (p. 51) asks for a matrix Lie group G and a matrix X with
      e^X in G and X not in its Lie algebra: statement 9, with this
      entry's example. Exercise 7 asks for the general matrix of so(3;1).
      The isomorphism of so(3;1) with sl(2;C) is not stated in these
      notes.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "MacDowell-Mansouri gravity and Cartan geometry"
    authors:
      - "D. K. Wise"
    id: "Class. Quantum Grav. 27 (2010) 155010; arXiv:gr-qc/0611154v2"
    # READ 2026-11-13 as arXiv:gr-qc/0611154v2 (Appendix, pp. 32-33 of the
    # arXiv version); journal reference and DOI from the arXiv record.
    type: "paper"
    location: "https://doi.org/10.1088/0264-9381/27/15/155010"
    relationship: "formalizes"
    note: >-
      Scoped to statement 4, without its clause on multiplication by -i.
      The Appendix prints the matrix of the Hodge operator on so(3,1) in
      the fundamental representation and states star(star X) = -X and
      star[X,X'] = [X, star X'], with star(star X) = +X in the so(4) case. The definition
      hodgeMatrix of this entry is the printed matrix with the time index
      moved from the beginning to the end (compared by an exact script on
      integer coefficients). The clause of statement 4 on multiplication
      by -i was not found printed; it follows from the values on the six
      generators in statements 2(c) and 4(b), by linearity.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Revisiting loop quantum gravity with selfdual variables: classical theory"
    authors:
      - "H. Sahlmann"
      - "R. Seeger"
    id: "Class. Quantum Grav. 41 (2024) 075010; arXiv:2310.19729"
    # Bibliographic record Crossref-verified 2026-11-13. READ 2026-11-13
    # as arXiv:2310.19729 (section 2.2.1, pp. 5-8 of the arXiv version).
    type: "paper"
    location: "https://doi.org/10.1088/1361-6382/ad2cec"
    relationship: "formalizes"
    note: >-
      Scoped to statement 5 and to H(HX) = -X of statement 4. In signature
      (-+++) the Hodge operator squares to -1; the projectors
      (1 -/+ i*)/2 onto its eigenspaces (7); the decomposition of the
      complexified algebra into selfdual and anti-selfdual parts (18); the
      bracket splits, (26) and (27), and the projectors are Lie algebra
      homomorphisms. Equation (35) writes the Cartan-Killing metric as
      twice a trace, the step between the Killing form of the sources of
      statement 6 and the trace form used here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On low-dimensional manifolds with isometric SO_0(p,q)-actions"
    authors:
      - "G. Olafsson"
      - "R. Quiroga-Barranco"
    id: "Transform. Groups 17 (2012) 835-860; arXiv:1003.0704v2"
    # Bibliographic record Crossref-verified 2026-11-13. READ 2026-11-13
    # as arXiv:1003.0704v2 (p. 9; Lemma A.1 and Remark A.2, p. 19; p. 20; Remark A.10, pp. 21-22, of the arXiv version).
    type: "paper"
    location: "https://doi.org/10.1007/s00031-012-9194-5"
    relationship: "formalizes"
    note: >-
      Scoped to statements 1, 2, 6 and 7(b), and to the simplicity used in
      7(c), (d). Lemma A.1 (p. 19): so(3,1) = sl(2,C)_R. Remark A.2 (p. 19):
      so(2,2) = sl(2,R) x sl(2,R) is not simple. Page 20: so(2,1) = sl(2,R).
      Page 9: so(p,q) is simple for p + q >= 4 and (p,q) != (2,2).
      Remark A.10: the invariant bilinear forms on
      so(2,2) = so(2,1) x so(2,1) are the combinations of the Killing
      forms of the factors; for the realification of a simple complex Lie
      algebra with Killing form K and complex structure J, the form
      K(X, J Y) is invariant and is not a multiple of K, and by Schur's
      lemma the invariant bilinear forms are a K + b K(., J .) with a, b
      real. Statement 6 is this for sl(2,C), with J the operator H up to
      sign and with the trace form of the action on Minkowski space in
      place of K.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Conformal properties of indefinite bi-invariant metrics"
    authors:
      - "K. Francis-Staite"
      - "T. Leistner"
    id: "Transform. Groups 26 (2021) 859-892; arXiv:1901.04682v2"
    # READ 2026-11-13 as arXiv:1901.04682v2 (Proposition 4.1 and the
    # paragraph after it, pp. 11-12 of the arXiv version). The four
    # references that paragraph cites were not read.
    type: "paper"
    location: "https://doi.org/10.1007/s00031-020-09561-9"
    relationship: "formalizes"
    note: >-
      Scoped to statement 6, for symmetric forms. Proposition 4.1: for a
      real simple Lie algebra, either its complexification is simple and
      the invariant symmetric bilinear forms are the multiples of the
      Killing form, or it is a complex simple Lie algebra regarded as
      real and they form a plane spanned by the real and the imaginary
      part of the complex Killing form. The paragraph after the
      proposition adds that simple Lie algebras admit no invariant
      skew-symmetric bilinear form. The proposition assumes that the
      algebra is simple; the simplicity of sl(2,C) as a real Lie algebra,
      used in parts (c) and (d) of statement 7, is taken from Olafsson and
      Quiroga-Barranco (p. 9 and Lemma A.1).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Plebanski formulation of general relativity: a practical introduction"
    authors:
      - "K. Krasnov"
    id: "Gen. Relativ. Gravit. 43 (2011) 1-15; arXiv:0904.0423v2"
    # READ 2026-11-13 as arXiv:0904.0423v2 (p. 3, p. 4 of the PDF, equations (1), (4), (5)).
    type: "paper"
    location: "https://doi.org/10.1007/s10714-010-1061-x"
    relationship: "background"
    note: >-
      Background for statements 4 and 5: the Hodge dual on bivectors, its
      square -1, selfdual and anti-selfdual bivectors and their
      projectors.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Lecture notes: Electromagnetism (Lent 2015) and Gauge Theory (2018)"
    authors:
      - "D. Tong"
    id: "University of Cambridge lecture notes; Electromagnetism p. 113, equation (5.25), and p. 127; Gauge Theory section 1.2, p. 10, equation (1.11)"
    # READ 2026-11-13 in the author's PDF files. Lecture notes, not a
    # published book.
    type: "other"
    relationship: "background"
    note: >-
      Source of the naming remark in the description only (the docstring of statement 6 uses the
      general name "kinetic term", which these pages do not print):
      the two Lorentz-invariant quadratic expressions in a field strength
      and its dual, and the names Maxwell term and theta term.
      No compared statement asserts anything about them; the reading of an
      element of L as a two-form is not formalized.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Physics 251, Problem Set 4, Spring 2026"
    id: "University of California, Santa Cruz; scipp-legacy.pbsci.ucsc.edu/~haber/ph251/groups26_4.pdf (4 pp.)"
    # READ 2026-11-13. The file does not name its author.
    type: "other"
    relationship: "background"
    note: >-
      Problem 1 asks in part (a) to work out so(4) and verify that it is
      so(3) + so(3), and in part (e) to show that so(3,1) is the
      realification of sl(2,C). Statements 1 and 7(a), posed as
      exercises in a graduate course. Parts (d) and (e) and the remark pose
      the complexified statement, statement 5 without its projections.
    license: "unknown"
    author_endorsement: "not-contacted"

