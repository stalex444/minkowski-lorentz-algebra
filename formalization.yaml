fidelity:
  divergences: >-
    (a) Conventions. Time is the index 3 and is positive in
    minkowskiBilin; epsilon_0123 = +1; the boost along k goes to
    -(1/2) sigma_k and the rotation to -(i/2) sigma_k. Under these, H is
    multiplication by -i and -H is multiplication by i. Woit's action
    (40.4) differentiates to boost -> +(1/2) sigma: the isomorphism here
    differs from that one by the sign of the boosts. (b) hodgeMatrix is
    X -> *(eta X) eta with eta = diag(1,1,1,-1), written entry by entry;
    it is Wise's printed matrix with the time index moved from the
    beginning to the end. Its docstring states its relation to the Hodge
    dual of two-forms for the two normalisations of the alternating
    symbol; that relation is not formalized. (c) spinMatrix and hodgeEnd
    are defined on all endomorphisms and every statement uses them on L
    only. (d) Statement 3. Hall's statement is for O(n;k) and matrices;
    here the group is the carried type ProperLorentz of invertible
    continuous linear maps with determinant 1 that preserve
    minkowskiSquare and the forward cone. The direction from the
    exponentials to L uses only the preservation of minkowskiSquare;
    determinant 1 and the cone clause are conclusions in the other
    direction. That ProperLorentz is the identity component of O(3;1) is
    not formalized. (e) Statement 6. The sources state the result with
    the Killing form K and the form K(., J .); here it is stated with the
    trace form of L acting on Minkowski space and with tr(H(X)Y). That
    the trace form is a nonzero multiple of the Killing form is not
    formalized. The statement is for all bilinear forms, with no symmetry
    assumed. The remark at the end of its docstring, on the two
    expressions in F = eta X and their names in the physics literature,
    rests on reading X as a two-form, which is not formalized. (f)
    Statement 6 is proved in the library from the classification of the
    linear maps R of L with R[X,Y] = [X,RY] (every such map is a id + b H
    for exactly one pair (a,b)), which is the subject of a separate entry
    in preparation and is not compared here; through the nondegenerate
    form tr(XY) the two are the same fact at this form. (g) Statement 7
    is on skewAdjointMatricesLieSubalgebra of a diagonal matrix, not on
    Mathlib's named so (Fin 4) R and so' (Fin 2) (Fin 2) R. Part (b) is
    stated with sl(2,R) x sl(2,R), as in Olafsson and Quiroga-Barranco,
    Remark A.2. Parts (c) and (d) were not found printed; each follows in
    one step from printed sentences (README.md). (h) Statement 5 states the property
    that identifies the two factors with the maps (1/2)(1 +/- iH); it
    does not give the isomorphism on generators. (i) Statement 8 is
    proved with an explicit antisymmetric form; the reason it holds is a
    count of dimensions. Statement 9: the example is this entry's. (j)
    The proofs were written before the sources were read and are not
    adapted from any of them: the
    isomorphisms are explicit linear maps of skew matrices with the
    bracket identities checked by computation on the matrix entries, and
    statement 3 is proved by differentiating t -> exp(tA) and by writing
    exp(tA) as a square. (k) Sources. Woit's book was read in the
    author's draft of 20 October 2025 and its section numbers are that
    draft's; Hall's notes in the arXiv version; Wise, Sahlmann-Seeger,
    Krasnov, Olafsson-Quiroga-Barranco and Francis-Staite-Leistner in
    their arXiv versions. The Springer editions of Woit and Hall and the
    references cited by Francis-Staite and Leistner were not opened. (l)
    The paragraph "Also proved in the library, not compared" (Minkowski
    space from a number field) is not compared: no compared statement
    asserts it. It is proved in the library of this entry (the seven
    declarations named under status.scope; Axioms.lean prints their
    axioms).

