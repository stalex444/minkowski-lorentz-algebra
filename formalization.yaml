status:
  scope: >-
    Formalized: nine compared theorems, in comparator order, namespace
    MinkowskiLorentz (see the description for their content), on eleven
    declarations carried from the public statement of the Yang-Mills
    release (Axis, SpaceAxis, timeAxis, Spacetime, Space, time, spatial,
    forwardCone, minkowskiSquare, ProperLorentz, PoincareCoordinates) and
    eleven definitions of this entry (minkowskiBilin, lorentzAlgebra,
    boostEnd, rotEnd, hodgeMatrix, hodgeEnd, sl2CReal, sl2CRealMat, pauli,
    spinOf, spinMatrix). Proved in the repository, not compared: the
    number-field adapter (ReleaseAdapter.mixedIso,
    ReleaseAdapter.minkowskiSquare_mixedIso,
    ReleaseAdapter.minkowskiSquare_mixedIso_mixedEmbedding,
    ReleaseAdapter.exists_mixedSpace_isometry,
    LorentzLie.NumberFieldAux.traceSkewEquivLorentzAlgebra,
    LorentzLie.NumberFieldAux.traceSkewEquivLorentzAlgebra_apply,
    LorentzLie.NumberFieldAux.finrank_traceSkew); the classification of
    the bracket-commuting maps of L
    (ReleaseAdapter.lorentzAlgebra_centroid_lorentzHodge), used in the
    proof of statement 6 and the subject of a separate entry in
    preparation; the simplicity of L (LorentzLie.etaSkew_isSimple), used
    in parts (c) and (d) of statement 7. Not stated: nothing about the
    Lie group beyond statement 3 (no covering map from SL(2,C) is
    constructed, no Lie group structure, no connectedness statement, no
    statement that every element of ProperLorentz is an exponential, and
    the Lie algebra of ProperLorentz is not defined other than through
    the one-parameter groups of statement 3); statement 5 does not give
    the isomorphism on generators; other dimensions and signatures
    beyond statement 7; the identification of L with two-forms (Mathlib's
    exteriorPower.hodgeStar is not used); that the trace form of
    statement 6 is a multiple of the Killing form; the invariant forms of
    the complexification; Spin groups and Clifford algebras; any
    physical claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

