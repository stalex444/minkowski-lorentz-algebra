alignment:
  namespace: "MinkowskiLorentz"
  statements:
    - source: "Woit, Quantum Theory, Groups and Representations (author's draft of 20 October 2025), section 40.4: SL(2,C) is said to have the same Lie algebra as SO(3,1), with the action (40.4) on Hermitian matrices; Physics 251 Problem Set 4 (2026), Problem 1(e), poses the isomorphism as an exercise. The explicit formula is printed on generators in section 41.2 (p. 441) as the upper block of pi'; it is also the derivative of (40.4) with the opposite sign for the boosts; Olafsson-Quiroga-Barranco, Lemma A.1, state so(3,1) = sl(2,C)_R"
      lean: "MinkowskiLorentz.so'_one_three_lieEquiv_sl2C"
      module: "Solution"
      status: "proved"
      note: "Mathlib's so' (Fin 1) (Fin 3) R is isomorphic over R to sl(2,C), and the isomorphism is the explicit map X -> -(1/2) sum_k (beta_k + i theta_k) sigma_k with beta_k = X (inr k) (inl 0) (boost entries) and theta_k = X (inr (k+2)) (inr (k+1)) (rotation entries). No definition copied from the Yang–Mills release is used. The same isomorphism as part (b) of statement 2, on another presentation."
    - source: "(a) Woit, section 40.2: the Lorentz group has dimension six, with the generators l_j, k_j and (40.1)-(40.2); (b) as statement 1; (c) Woit, section 41.2 (p. 441): the upper blocks of pi'(k_j) and pi'(l_j) are -(1/2) sigma_j and -(i/2) sigma_j"
      lean: "MinkowskiLorentz.lorentzAlgebra_lieEquiv_sl2C"
      module: "Solution"
      status: "proved"
      note: "On the carried copy: (a) L has real dimension 6; (b) spinMatrix restricted to L is (the matrix of) an isomorphism of real Lie algebras from L onto sl(2,C); (c) the three boosts and three rotations are in L and go to -(1/2) sigma_k and -(i/2) sigma_k."
    - source: "Hall, arXiv:math-ph/0005032v1, Definition 3.13 (p. 36) and Chapter 3, section 5.6 (p. 38), for O(n;k); the source says, without proof in the passage, that the identity component has the same Lie algebra. Part (a) is a remark on the definitions of this entry"
      lean: "MinkowskiLorentz.mem_lorentzAlgebra_iff_exp"
      module: "Solution"
      status: "proved"
      note: "(a) minkowskiBilin x x = minkowskiSquare x (the carried quadratic form is the quadratic form of the entry's bilinear form). (b) A continuous linear A is in L iff every exp(tA), t real, is in the carried ProperLorentz."
    - source: "Wise, Class. Quantum Grav. 27 (2010) 155010 (arXiv:gr-qc/0611154v2), Appendix: the matrix of the operator, star(star X) = -X and star[X,X'] = [X, star X']; Sahlmann-Seeger, section 2.2.1, for the square -1. The clause on multiplication by -i was not found printed: it follows from statements 2(c) and 4(b) by linearity"
      lean: "MinkowskiLorentz.hodgeEnd_complexStructure"
      module: "Solution"
      status: "proved"
      note: "(a) hodgeEnd restricts to a real-linear H from L to L with H[X,Y] = [X,HY], H(HX) = -X, and spinMatrix (H X) = -i spinMatrix X: under the isomorphism of statement 2, H is multiplication by -i. (b) H(boost k) = -rot(k+1,k+2), H(rot(k+1,k+2)) = boost k."
    - source: "Woit, section 40.2: A_j, B_j = (1/2)(l_j +/- i k_j) and so(3,1) (x) C = sl(2,C) + sl(2,C); Sahlmann-Seeger, Class. Quantum Grav. 41 (2024) 075010, section 2.2.1, (7), (18), (26)-(27): the projectors (1 -/+ i*)/2 are Lie algebra homomorphisms"
      lean: "MinkowskiLorentz.complexification_lieEquiv"
      module: "Solution"
      status: "proved"
      note: "The complexification of L is isomorphic to sl(2,C) x sl(2,C) as complex Lie algebras, by an isomorphism E under which (1/2)(1 + iH_C) is the projection onto the factor (., 0) and (1/2)(1 - iH_C) the projection onto (0, .); H is the linear map of statement 4 (H X = hodgeEnd X is part of the statement). E is not given on generators."
    - source: "Olafsson-Quiroga-Barranco, Transform. Groups 17 (2012) 835-860, Remark A.10: the invariant bilinear forms of the realification of a simple complex Lie algebra are a K + b K(., J .); Francis-Staite-Leistner, Transform. Groups 26 (2021) 859-892, Proposition 4.1(2) and the paragraph after it (symmetric forms; no skew ones). Step not formalized: the trace form of the action on Minkowski space is a nonzero multiple of the Killing form (compare Sahlmann-Seeger (35))"
      lean: "MinkowskiLorentz.invariant_bilinForm_iff"
      module: "Solution"
      status: "proved"
      note: "A bilinear form on L is invariant iff it is a tr(XY) + b tr(H(X)Y) for exactly one real pair; invariant forms are symmetric. tr(XY) is Mathlib's LieModule.traceForm of L acting on Spacetime."
    - source: "(a) Woit, section 21.2 (p. 241 of the draft): so(4) = so(3) x so(3); Physics 251 Problem Set 4 (2026), Problem 1(a). (b) Olafsson-Quiroga-Barranco, Remark A.2 (p. 19): so(2,2) = sl(2,R) x sl(2,R); also their Remark A.10, so(2,2) = so(2,1) x so(2,1), and Woit, section 40.4, Spin(2,2) = SL(2,R) x SL(2,R) for the groups. (c), (d): not found printed; they follow from the simplicity of so(3,1) = sl(2,C)_R (Olafsson-Quiroga-Barranco, p. 9 and Lemma A.1) and the non-simplicity of so(2,2) (Remark A.2) and of so(4) = so(3) x so(3)"
      lean: "MinkowskiLorentz.definite_split_signature"
      module: "Solution"
      status: "proved"
      note: "Control. so(4) is isomorphic to so(3) x so(3), so(2,2) to sl(2,R) x sl(2,R) (as Mathlib's skewAdjointMatricesLieSubalgebra of diag(1,1,1,1), diag(1,1,-1,-1)), and neither is isomorphic to sl(2,C) over R."
    - source: "Not located in a source; it holds by a count of dimensions (the bilinear forms on a six-dimensional space have dimension 36; the forms of statement 6 are a plane)"
      lean: "MinkowskiLorentz.exists_bilinForm_not_trace_form"
      module: "Solution"
      status: "proved"
      note: "Control of statement 6. Some bilinear form on L is not in the two-parameter family of statement 6 (so it is not invariant). The proof exhibits an antisymmetric form; the forms of statement 6 are symmetric."
    - source: "Hall, arXiv:math-ph/0005032v1, Chapter 3, Exercise 5 (p. 51), posed as an exercise; the example is this entry's"
      lean: "MinkowskiLorentz.exists_exp_mem_not_mem_lorentzAlgebra"
      module: "Solution"
      status: "proved"
      note: "Control of statement 3. There is A with exp A in ProperLorentz and A not in L."

